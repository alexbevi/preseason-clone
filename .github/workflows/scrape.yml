name: Refresh scrape data

on:
  workflow_dispatch:
    inputs:
      workers:
        description: "Concurrent fetch workers (default 2; do not exceed 3)"
        required: false
        default: "2"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # Need write token to push the refreshed data commit back.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore raw cache
        uses: actions/cache@v4
        with:
          path: data/raw
          # Cache key changes weekly so we periodically force a clean fetch.
          key: scrape-cache-${{ github.run_number }}
          restore-keys: |
            scrape-cache-

      - name: Run scrape pipeline
        env:
          WORKERS: ${{ inputs.workers }}
        run: |
          python3 scrape.py inventory
          python3 scrape.py plan
          python3 scrape.py scrape --workers "${WORKERS:-2}"
          python3 scrape.py extract

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          # Summarize what changed so the commit message is useful.
          summary=$(git diff --cached --stat data/json | tail -n +1)
          git commit -m "data: refresh scrape ($(date -u +%Y-%m-%d))" \
                     -m "$summary"
          git push
